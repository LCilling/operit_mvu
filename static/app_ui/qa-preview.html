<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="color-scheme" content="light" />
    <title>MVU UI QA</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="embedded">
    <script>
      if (new URLSearchParams(window.location.search).get("unscaled") === "1") {
        document.body.classList.remove("embedded");
      }
    </script>
    <main class="showcase"><aside class="design-rail" aria-hidden="true"><nav id="screenNav"></nav></aside><section class="device-stage"><div class="phone-shell"><div class="phone-screen" id="appRoot"></div></div><div class="screen-caption" id="screenCaption" aria-live="polite"></div></section></main>
    <input class="visually-hidden" id="backgroundPicker" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择背景图片" tabindex="-1" />
    <input class="visually-hidden" id="datasetImportPicker" type="file" accept="application/json,.json" aria-label="选择数据集文件" tabindex="-1" />
    <div class="toast" id="toast" role="status"></div>
    <script src="qa-harness.js"></script>
    <script src="app.js"></script>
  </body>
</html>
