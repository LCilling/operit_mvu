<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MVU 130% text scale fixture</title>
    <link rel="stylesheet" href="../../static/app_ui/styles.css" />
    <script>
      window.__fontScaleReady = fetch("../../static/app_ui/styles.css")
        .then(function (response) { return response.text(); })
        .then(function (css) {
          const scaled = css
            .replace(/((?:font-size|line-height|--type-body)\s*:\s*)(\d+(?:\.\d+)?)px/g, function (_match, prefix, value) {
              return prefix + (Number(value) * 1.3).toFixed(2) + "px";
            })
            .replaceAll('url("./assets/', 'url("../../static/app_ui/assets/');
          const style = document.createElement("style");
          style.id = "font-scale-130";
          style.textContent = scaled;
          document.head.appendChild(style);
          document.documentElement.dataset.fontScaleReady = "130";
        });
    </script>
  </head>
  <body class="embedded">
    <main class="showcase" id="showcase">
      <aside class="design-rail" aria-hidden="true"><nav class="screen-nav" id="screenNav"></nav></aside>
      <section class="device-stage" aria-label="动态状态">
        <div class="phone-shell"><div class="phone-screen" id="appRoot" data-phone-screen></div></div>
        <div class="screen-caption" id="screenCaption" aria-live="polite"></div>
      </section>
    </main>
    <input class="visually-hidden" id="backgroundPicker" type="file" accept="image/jpeg,image/png,image/webp" aria-label="选择背景图片" tabindex="-1" />
    <input class="visually-hidden" id="datasetImportPicker" type="file" accept="application/json,.json" aria-label="选择数据集文件" tabindex="-1" />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="../../static/app_ui/runtime.js"></script>
    <script src="../../static/app_ui/components.js"></script>
    <script src="../../static/app_ui/pages-status.js"></script>
    <script src="../../static/app_ui/pages-config.js"></script>
    <script src="../../static/app_ui/pages-rules.js"></script>
    <script src="../../static/app_ui/pages-advanced.js"></script>
    <script src="../../static/app_ui/app.js"></script>
  </body>
</html>
