<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Malformed NativeMvu recovery fixture</title>
    <link rel="stylesheet" href="../../static/app_ui/styles.css" />
  </head>
  <body class="embedded">
    <main class="showcase">
      <section class="device-stage" aria-label="错误恢复测试">
        <div class="phone-shell"><div class="phone-screen" id="appRoot" data-phone-screen></div></div>
      </section>
    </main>
    <input class="visually-hidden" id="backgroundPicker" type="file" tabindex="-1" />
    <input class="visually-hidden" id="datasetImportPicker" type="file" tabindex="-1" />
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
      function fixturePage(items) {
        return { items, loadedCount: items.length, totalCount: items.length, hasMore: false, nextCursor: null };
      }
      window.NativeMvu = {
        call(method, _params, callbackId) {
          window.setTimeout(function () {
            if (method !== "snapshot") {
              window.__mvuResolve(callbackId, fixturePage([]));
              return;
            }
            const field = {
              id: "field_a", name: "亲密度", description: "关系", enabled: true, scope: "character", order: 0,
              range: { minimum: 0, maximum: 100, step: 1 }, theme: { icon: "favorite", color: "#ff4f88" },
              current: { value: 48, stage: { id: "warm", name: "熟悉", threshold: 7 },
                scopeKey: "character:actor_a", actorId: "actor_a", groupId: "group_a", chatId: "chat_a" },
              truncated: false,
            };
            window.__mvuResolve(callbackId, {
              revision: 1,
              snapshotTruncated: false,
              activeContext: { chatId: "chat_a", actorId: "actor_a", groupId: "group_a", actorName: "角色甲", truncated: false },
              settings: { aiEnabled: true },
              migrationStatus: { mode: "v3", source: "existing", truncated: false },
              counts: { fields: 1, actors: 1, groups: 1, rules: 0, conditions: 0, effectGroups: 0, records: 1 },
              selected: {
                actor: { characterId: "actor_a", name: "角色甲", avatarUri: null, avatarUriUnavailable: false, enabled: true, truncated: false },
                group: { characterGroupId: "group_a", name: "群组甲", avatarUri: null, avatarUriUnavailable: false, truncated: false },
              },
              contextLabels: { groupName: "群组甲", chatName: "角色甲会话", truncated: false },
              returnedCount: { fields: 1, rules: 0, conditions: 0, effectGroups: 0, records: 1 },
              pages: {
                fields: fixturePage([field]), rules: fixturePage([]), conditions: fixturePage([]), effectGroups: fixturePage([]),
                records: fixturePage([{ id: "record_bad", fieldId: "field_a", fieldName: "亲密度",
                  actorId: "actor_a", groupId: "group_a", before: 47, after: 48, delta: 1,
                  reason: "坏记录缺少 actorName", source: "manual", occurredAt: 2000000000000, truncated: false }]),
              },
            });
          }, 0);
        },
      };
    </script>
    <script src="../../static/app_ui/runtime.js"></script>
    <script src="../../static/app_ui/components.js"></script>
    <script src="../../static/app_ui/pages-status.js"></script>
    <script src="../../static/app_ui/pages-config.js"></script>
    <script src="../../static/app_ui/pages-rules.js"></script>
    <script src="../../static/app_ui/pages-advanced.js"></script>
    <script src="../../static/app_ui/app.js"></script>
  </body>
</html>
